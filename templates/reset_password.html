<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyGPT - Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='reset_password.css') }}">
</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <div class="brand-logo">
            <div class="robot-icon">🤖</div>
            <h1>My<span>GPT</span></h1>
        </div>

        <div class="reset-icon">
            🔐
        </div>

        <h2>Reset Your Password</h2>

        <p class="subtitle">
            Create a new password for your <span>MyGPT</span> account.
        </p>


        <form method="POST">

            <!-- New Password -->

            <div class="input-group">

                <label for="password">
                    New Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

            </div>


            <!-- Reset Button -->

            <button type="submit" class="reset-btn">

                <span>Change Password</span>

                <span class="arrow">→</span>

            </button>

        </form>


        <p class="signin-text">

            Remember your password?

            <a href="{{ url_for('signin') }}">
                Sign In
            </a>

        </p>

    </div>

</div>

</body>

</html>
