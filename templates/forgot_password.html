<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyGPT - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='forgot_password.css') }}">
</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <!-- MyGPT Logo -->

        <div class="brand-logo">

            <div class="robot-icon">
                🤖
            </div>

            <h1>
                My<span>GPT</span>
            </h1>

        </div>


        <!-- Icon -->

        <div class="forgot-icon">
            🔑
        </div>


        <!-- Heading -->

        <h2>
            Forgot Your Password?
        </h2>

        <p class="subtitle">
            Enter the email address associated with your
            <span>MyGPT</span> account.
        </p>


        <!-- Email Form -->

        <form method="POST">

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span>✉️</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- Reset Button -->

            <button type="submit" class="reset-btn">

                <span>
                    Reset Password
                </span>

                <span class="arrow">
                    →
                </span>

            </button>

        </form>


        <!-- Back to Sign In -->

        <p class="signin-text">

            Remember your password?

            <a href="{{ url_for('signin') }}">
                Sign In
            </a>

        </p>

    </div>

</div>

</body>

</html>
